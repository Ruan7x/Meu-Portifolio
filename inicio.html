<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruan Fabrício | Portfólio</title>
    <link rel="stylesheet" href="style2.css">

<body>

        </video>

        <div class="content">

            <h1>RUAN <span>FABRÍCIO</span></h1>
            <p class="subtitle">Desenvolvedor em formação</p><button id="enterButton">ENTRAR NO PORTFÓLIO

            </div>
            <div class="progress-info"><span>PORTFÓLIO</span><span id="percentage">0%</span></div>
